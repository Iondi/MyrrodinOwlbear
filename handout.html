<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Myr'rodin Handout</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&display=swap" rel="stylesheet" />
  <style>
    html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
    .backdrop { position: fixed; inset: 0; background: rgba(10, 7, 14, .78); backdrop-filter: blur(3px); display: grid; place-items: center; cursor: zoom-out; animation: fade .25s ease; }
    figure { margin: 0; display: grid; justify-items: center; gap: 12px; max-width: 92vw; max-height: 92vh; cursor: default; animation: rise .35s cubic-bezier(.2, .8, .2, 1); }
    img { max-width: 92vw; max-height: calc(92vh - 70px); min-height: min(60vh, 640px); width: auto; object-fit: contain; border-radius: 10px; border: 1.5px solid rgba(216, 180, 106, .7); box-shadow: 0 20px 60px rgba(0, 0, 0, .6), 0 0 50px rgba(138, 92, 240, .25); background: #1b1622; }
    figcaption { display: flex; align-items: baseline; gap: 12px; padding: 8px 16px; border-radius: 99px; background: rgba(20, 15, 27, .9); border: 1px solid rgba(216, 180, 106, .45); color: #efe8f3; font: 14px system-ui, sans-serif; }
    figcaption b { font-family: "Cinzel", Georgia, serif; color: #d8b46a; letter-spacing: .05em; font-size: 17px; }
    figcaption small { color: #a99bb5; }
    .close { position: fixed; top: 16px; right: 16px; width: 40px; height: 40px; border-radius: 50%; border: 1px solid rgba(216, 180, 106, .6); background: rgba(20, 15, 27, .9); color: #efe8f3; font-size: 18px; cursor: pointer; }
    .close:hover { background: #2a2134; }
    .err { color: #efe8f3; font: 15px system-ui, sans-serif; }
    @keyframes fade { from { opacity: 0; } }
    @keyframes rise { from { opacity: 0; transform: translateY(14px) scale(.97); } }
  </style>
</head>
<body>
  <div class="backdrop" id="bd">
    <figure id="fig"><img id="img" alt="" /><figcaption id="cap"></figcaption></figure>
  </div>
  <button class="close" id="x" title="Close (Esc)" aria-label="Close">✕</button>
  <script type="module">
    import OBR from "./vendor/obr-sdk.js?v=1.10.0";
    const q = new URLSearchParams(location.search);
    const url = q.get("u") || "", title = q.get("t") || "Handout", by = q.get("b") || "";
    const img = document.getElementById("img");
    img.src = url; img.alt = title;
    img.onerror = () => { document.getElementById("fig").innerHTML = `<p class="err">This handout couldn't be loaded. It may have been deleted.</p>`; };
    const cap = document.getElementById("cap");
    const b = document.createElement("b"); b.textContent = title; cap.append(b);
    if (by) { const s = document.createElement("small"); s.textContent = `from ${by}`; cap.append(s); }
    const inOBR = q.has("obrref");
    const close = () => { if (inOBR) OBR.modal.close("com.emberbelle.myrrodin/handout-modal"); else window.close(); };
    document.getElementById("x").onclick = close;
    document.getElementById("bd").onclick = (e) => { if (!e.target.closest("figure")) close(); };
    addEventListener("keydown", (e) => { if (e.key === "Escape") close(); });
  </script>
</body>
</html>
